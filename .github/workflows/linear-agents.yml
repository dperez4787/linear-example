# Remote developer/tester agents driven by Linear ticket status.
#
# The whole loop is autonomous (DAN-98), and for prompt:*-labeled tickets it now
# runs end to end with NO human after the in-app Approve (DAN-100) — the human
# gate moved from per-PR to per-feature:
#
#   status "Ready for Dev"                      → develop job: claims the ticket
#                                                 (→ In Progress), implements it, opens a
#                                                 draft PR, then THE WORKFLOW moves the
#                                                 ticket to In Review (no human action)
#   status "In Review" without `agent-tested`   → test job: verifies acceptance criteria,
#                                                 comments the verdict, lifts the draft on pass
#   tester PASS + `prompt:*` label              → the SAME test run merges the PR (merge
#                                                 commit, branch deleted) and moves the ticket
#                                                 to Done (DAN-100); the relay dispatches on the
#                                                 Done transition, which promotes the next
#                                                 blocked ticket in the chain
#   human merges the PR                         → only for tickets WITHOUT a prompt:* label
#                                                 (their behavior is unchanged: lifted draft,
#                                                 In Review, unmerged)
#
# DAN-100 auto-merge signal and failure mode: PASS means the PR's draft bit was
# lifted AND a "Tester verdict" PASS comment was posted since the run started —
# both, never one alone (.github/scripts/auto-merge-decision.mjs). The merge and
# the Done move each fail the job LOUDLY on error; the ticket then stays In
# Review with `agent-tested` for the next scan or a human — the correct degraded
# state. This repo has no required-review branch protection; if one is added
# later, `gh pr merge` will be rejected (github-actions[bot] cannot approve its
# own PR), the job fails loudly, and every prompt-labeled ticket parks In Review
# until a human merges or the protection is lifted.
#
# Every 5 minutes the scan job polls Linear (a single GraphQL request — no Claude
# tokens are spent unless a ticket is actually waiting). Before looking for tickets
# to hand to agents, the scan runs two loop-closing passes (DAN-98, see
# .github/scripts/linear-loop-scan.mjs — both touch ONLY prompt:*-labeled tickets):
#
#   reconciliation — In Progress + GitHub PR attachment + no `agent-tested` means a
#     completed dev leg whose In Review handoff was missed → move to In Review.
#     (The dev leg opens the PR as its LAST act, so PR-present = dev finished; an
#     active develop run's ticket has no PR yet and is left alone.)
#   dependent promotion — a backlog/unstarted ticket whose "blocked by" issues are
#     ALL resolved (state TYPE `completed` or `canceled` — a canceled blocker will
#     never finish, so it must not strand the chain) → move to Ready for Dev, which
#     the relay/scan then dispatches. Any still-open blocker → untouched.
#
# The claim is the status change: develop moves the ticket to In Progress before Claude
# starts, so a ticket is never picked up twice. To re-run either leg, drag the ticket
# back to the trigger status (the develop claim also strips `agent-tested`).
#
# Partition (DAN-44): this scan only works tickets whose Linear project is NOT
# `ai-gateway` — that project's tickets belong to the ai-gateway repo's own scan.
# Tickets in every other project (e.g. `prompt-a-feature`) belong here. Fail safe:
# if a ticket's project cannot be determined, leave it alone.
#
# Secrets required: ANTHROPIC_API_KEY (Claude API billing), LINEAR_API_KEY.
# Subscription billing instead: replace `anthropic_api_key` with
# `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}` (from `claude setup-token`).

name: Linear agents

on:
  schedule:
    - cron: '*/5 * * * *'
  # Fired by the Linear relay (ai-gateway repo, DAN-44) the moment a ticket
  # changes status — instant pickup; the cron above stays as the backstop.
  # Both paths converge on the same scan, and the status change is the claim,
  # so a dispatch racing a scheduled run cannot double-pick a ticket.
  repository_dispatch:
    types: [linear-status-change]
  workflow_dispatch: {}

# DAN-100 permissions audit: `gh pr merge --merge --delete-branch` needs exactly
# `contents: write` (create the merge commit, delete the branch) and
# `pull-requests: write` (merge the PR) — both were ALREADY granted here for the
# develop/test legs (pushing branches, opening/commenting PRs), so the added
# permission delta for auto-merge is zero.
permissions:
  contents: write
  pull-requests: write

env:
  LINEAR_TEAM_KEY: DAN
  # This repo's scan works every project EXCEPT this one (ai-gateway's own
  # workflow filters TO it — together the two scans partition the DAN team).
  EXCLUDED_LINEAR_PROJECT: ai-gateway
  STATE_READY_FOR_DEV: 8d578131-713b-41ea-b940-135b55b7b86b
  STATE_IN_PROGRESS: 561a64fd-33e0-43ad-8ce3-12d4e07d6624
  STATE_IN_REVIEW: 4ce22db3-e24c-4a43-b2ee-d8ec4b0c64b6
  STATE_TODO: 7e52dca3-ae1c-4558-a17f-109eb9622f90
  STATE_DONE: afd17d47-af6c-4112-9655-f1ef5a7f1d11
  LABEL_AGENT_TESTED: 807df70e-ece2-48f9-b882-d5f466c46a30

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      develop: ${{ steps.scan.outputs.develop }}
      test: ${{ steps.scan.outputs.test }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # DAN-98: reconciliation (missed In Review handoffs) + dependent promotion
      # (unblocked chains → Ready for Dev). Runs BEFORE the find step so a ticket
      # healed or promoted here is picked up by THIS run's develop/test legs; the
      # relay dispatch fired by the same transition converges on the claim (the
      # status change), so no double pickup. Logic + guards documented in the
      # script header; unit-tested with node --test '.github/scripts/*.test.mjs'.
      - name: Reconcile completed dev work and promote unblocked dependents
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node .github/scripts/linear-loop-scan.mjs

      - name: Find tickets waiting on an agent
        id: scan
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          GQL='query($dev: ID, $test: ID) {
            dev: issues(filter: { state: { id: { eq: $dev } } }, first: 10) {
              nodes { id identifier title branchName project { name } }
            }
            test: issues(filter: { state: { id: { eq: $test } } }, first: 10) {
              nodes { id identifier title branchName project { name } labels { nodes { name } } }
            }
          }'
          QUERY=$(jq -n --arg q "$GQL" --arg dev "$STATE_READY_FOR_DEV" --arg test "$STATE_IN_REVIEW" \
            '{query: $q, variables: {dev: $dev, test: $test}}')
          RESP=$(curl -sS --fail https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$QUERY")
          echo "$RESP" | jq -e '.data' > /dev/null  # fail loudly on GraphQL errors
          # Partition rule (DAN-44): only work tickets whose Linear project is NOT
          # "ai-gateway" (those belong to the ai-gateway repo's scan); if a ticket's
          # project cannot be determined (missing or null), leave it alone — better
          # untouched than agents running in the wrong repo.
          IN_SCOPE='select((.project | type == "object") and (.project.name | type == "string") and (.project.name != env.EXCLUDED_LINEAR_PROJECT))'
          DEV=$(echo "$RESP" | jq -c "[.data.dev.nodes[] | $IN_SCOPE | {id, identifier, title, branchName}]")
          TEST=$(echo "$RESP" | jq -c "[.data.test.nodes[] | $IN_SCOPE
            | select(([.labels.nodes[].name] | index(\"agent-tested\")) | not)
            | {id, identifier, title, branchName}]")
          echo "develop=$DEV" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "Ready for Dev: $(echo "$DEV" | jq -r 'if length == 0 then "none" else [.[].identifier] | join(", ") end')"
          echo "Ready for test: $(echo "$TEST" | jq -r 'if length == 0 then "none" else [.[].identifier] | join(", ") end')"

  develop:
    needs: scan
    if: needs.scan.outputs.develop != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1   # agents work one ticket at a time (CLAUDE.md)
      matrix:
        issue: ${{ fromJSON(needs.scan.outputs.develop) }}
    concurrency:
      group: linear-develop-${{ matrix.issue.identifier }}
      cancel-in-progress: false
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: linear_example_test
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Claim ticket (move to In Progress)
        id: claim
        run: |
          set -euo pipefail
          gql() {
            curl -sS --fail https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$1"
          }
          STATE=$(gql "$(jq -n --arg id "${{ matrix.issue.id }}" \
            '{query: "query($id: String!) { issue(id: $id) { state { id } } }", variables: {id: $id}}')" \
            | jq -r '.data.issue.state.id')
          if [ "$STATE" != "$STATE_READY_FOR_DEV" ]; then
            echo "Ticket already claimed or moved (state $STATE); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gql "$(jq -n --arg id "${{ matrix.issue.id }}" --arg state "$STATE_IN_PROGRESS" \
            '{query: "mutation($id: String!, $state: String!) { issueUpdate(id: $id, input: { stateId: $state }) { success } }", variables: {id: $id, state: $state}}')" \
            | jq -e '.data.issueUpdate.success' > /dev/null
          # A re-run of a previously tested ticket starts a fresh test cycle
          gql "$(jq -n --arg id "${{ matrix.issue.id }}" --arg label "$LABEL_AGENT_TESTED" \
            '{query: "mutation($id: String!, $label: String!) { issueRemoveLabel(id: $id, labelId: $label) { success } }", variables: {id: $id, label: $label}}')" \
            > /dev/null || true
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Implement ticket
        if: steps.claim.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: |
            --dangerously-skip-permissions
            --mcp-config '{"mcpServers":{"linear-server":{"type":"http","url":"https://mcp.linear.app/mcp","headers":{"Authorization":"Bearer ${{ secrets.LINEAR_API_KEY }}"}}}}'
          prompt: |
            You are running unattended in GitHub Actions on a fresh checkout of
            ${{ github.repository }} (branch main, run ${{ github.run_id }}).

            Ticket: ${{ matrix.issue.identifier }} — ${{ matrix.issue.title }}
            Git branch from Linear (use verbatim): ${{ matrix.issue.branchName }}

            Launch the `developer` agent (Agent tool, subagent_type "developer") to
            implement this ticket end to end per CLAUDE.md. Tell it to:
            - Fetch the ticket and its acceptance criteria with the Linear MCP
              get_issue tool. The criteria on the issue are the spec.
            - Create the branch off main, implement, commit (subjects start with the
              ticket ID), push with `git push -u origin <branch>`, and open a DRAFT PR
              (`gh pr create --draft`) whose body links the Linear issue and states
              what was verified.
            - The ticket is already in "In Progress"; leave the Linear status alone —
              the workflow moved it there and, once your draft PR exists, a later
              workflow step moves the ticket to "In Review" itself, which hands it
              to the tester agent. No human touches the status; on a tester PASS
              the workflow even merges prompt-labeled tickets itself — a human
              merge remains only for tickets without a prompt:* label.

            CI environment notes — these OVERRIDE the corresponding CLAUDE.md sections:
            - Do NOT run `source ~/.zshenv`; node, npm, git, and gh are already on PATH.
            - MongoDB is a local service container; MONGODB_URI and MONGODB_DB are
              already exported. There is no Atlas access and no .env file to read.
            - `gh` is authenticated via GH_TOKEN. Never push to main.

            When the developer agent finishes, verify the draft PR exists with
            `gh pr view ${{ matrix.issue.branchName }}` and state its URL. If the
            ticket cannot be implemented (unclear criteria, unsettled design), comment
            the blocker on the Linear issue, move the issue back to "Todo", and stop
            without opening a PR.

      # DAN-98: the In Review handoff belongs to the workflow, not to prompts or
      # humans. If the draft PR exists, dev work is done (opening it is the dev
      # leg's last act) — hand the ticket to the tester. The one legitimate no-PR
      # outcome is the agent bouncing an unimplementable ticket back to "Todo";
      # anything else without a PR is a stranded run and must fail loudly.
      - name: Verify draft PR exists
        if: steps.claim.outputs.skip != 'true'
        id: verify_pr
        run: |
          set -euo pipefail
          PR_URL=$(gh pr view "${{ matrix.issue.branchName }}" \
            --repo "${{ github.repository }}" --json url -q .url 2>/dev/null || true)
          if [ -n "$PR_URL" ]; then
            echo "Draft PR for ${{ matrix.issue.identifier }}: $PR_URL"
            echo "handoff=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "handoff=no" >> "$GITHUB_OUTPUT"
          STATE=$(curl -sS --fail https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "${{ matrix.issue.id }}" \
              '{query: "query($id: String!) { issue(id: $id) { state { id name } } }", variables: {id: $id}}')")
          echo "$STATE" | jq -e '.data' > /dev/null  # fail loudly on GraphQL errors
          STATE_ID=$(echo "$STATE" | jq -r '.data.issue.state.id')
          STATE_NAME=$(echo "$STATE" | jq -r '.data.issue.state.name')
          if [ "$STATE_ID" = "$STATE_IN_PROGRESS" ]; then
            echo "::error::No PR for ${{ matrix.issue.identifier }} and the ticket is still In Progress — the develop leg stranded it."
            exit 1
          fi
          echo "No PR, but ${{ matrix.issue.identifier }} was moved to \"$STATE_NAME\" by the agent (bounced); skipping handoff."

      - name: Move ticket to In Review
        if: steps.claim.outputs.skip != 'true' && steps.verify_pr.outputs.handoff == 'yes'
        run: |
          set -euo pipefail
          curl -sS --fail https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "${{ matrix.issue.id }}" --arg state "$STATE_IN_REVIEW" \
              '{query: "mutation($id: String!, $state: String!) { issueUpdate(id: $id, input: { stateId: $state }) { success } }", variables: {id: $id, state: $state}}')" \
            | jq -e '.data.issueUpdate.success' > /dev/null
          echo "${{ matrix.issue.identifier }} → In Review (handed to the tester agent)"

  test:
    needs: scan
    if: needs.scan.outputs.test != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        issue: ${{ fromJSON(needs.scan.outputs.test) }}
    concurrency:
      group: linear-test-${{ matrix.issue.identifier }}
      cancel-in-progress: false
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: linear_example_test
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Confirm ticket still needs testing
        id: guard
        run: |
          set -euo pipefail
          RESP=$(curl -sS --fail https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "${{ matrix.issue.id }}" \
              '{query: "query($id: String!) { issue(id: $id) { state { id } labels { nodes { name } } } }", variables: {id: $id}}')")
          STATE=$(echo "$RESP" | jq -r '.data.issue.state.id')
          TESTED=$(echo "$RESP" | jq -r '[.data.issue.labels.nodes[].name] | index("agent-tested") != null')
          if [ "$STATE" != "$STATE_IN_REVIEW" ] || [ "$TESTED" = "true" ]; then
            echo "Ticket no longer awaiting test; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # DAN-100: whether this ticket is in the autonomous prompt-a-feature
          # flow (prompt:* label) — decides auto-merge eligibility later. Read
          # from the labels this query already fetched; no extra request.
          echo "prompt=$(echo "$RESP" | jq -r '[.data.issue.labels.nodes[].name] | any(startswith("prompt:"))')" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Verify ticket
        if: steps.guard.outputs.skip != 'true'
        id: verify
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: |
            --dangerously-skip-permissions
            --mcp-config '{"mcpServers":{"linear-server":{"type":"http","url":"https://mcp.linear.app/mcp","headers":{"Authorization":"Bearer ${{ secrets.LINEAR_API_KEY }}"}}}}'
          prompt: |
            You are running unattended in GitHub Actions on ${{ github.repository }}
            (run ${{ github.run_id }}).

            Ticket to verify: ${{ matrix.issue.identifier }} — ${{ matrix.issue.title }}
            PR branch (from Linear): ${{ matrix.issue.branchName }}

            Check out the PR branch (`gh pr checkout ${{ matrix.issue.branchName }}`),
            then launch the `tester` agent (Agent tool, subagent_type "tester") to
            verify this ticket per CLAUDE.md. Tell it to:
            - Fetch the acceptance criteria with the Linear MCP get_issue tool and
              verify against THEM, by running the code — not against what the
              developer says it built.
            - Add its tests as a separate commit on the same branch and push.
            - Post the pass/fail verdict with evidence as a comment on BOTH the Linear
              issue and the PR (`gh pr comment`). The PR comment MUST begin with the
              exact phrase "Tester verdict" (e.g. "## Tester verdict — PASS") — the
              workflow only marks the ticket tested if a comment containing that
              phrase exists, so omitting it voids the run. Do not submit a formal
              GitHub review: CI's identity authored the PR and GitHub forbids
              self-approval — the PR comment is the verdict.
            - If every criterion passes: run `gh pr ready ${{ matrix.issue.branchName }}`
              and leave the Linear status at "In Review" (do NOT merge: a later
              workflow step auto-merges prompt-labeled tickets; a human merges
              the rest).
            - If any criterion fails: leave the PR a draft and move the Linear issue
              back to "In Progress" so the failure is visible on the board.

            CI environment notes — these OVERRIDE the corresponding CLAUDE.md sections:
            - Do NOT run `source ~/.zshenv`; node, npm, git, and gh are already on PATH.
            - MongoDB is a local service container; MONGODB_URI and MONGODB_DB are
              already exported. There is no Atlas access and no .env file to read.
            - `gh` is authenticated via GH_TOKEN. Never push to main, never merge.

      # The label may only be applied when the tester demonstrably ran: a silent
      # Claude no-op that exits 0 (it has happened) must not mark the ticket tested,
      # or it wedges invisibly — labeled but verdict-less, skipped by every scan.
      # Without the label, the next scheduled scan simply retries the ticket.
      - name: Mark ticket agent-tested (evidence-gated)
        if: steps.guard.outputs.skip != 'true'
        id: tested
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
            --head "${{ matrix.issue.branchName }}" --state all \
            --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No PR found for ${{ matrix.issue.branchName }} — cannot have been tested; not labeling."
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          # DAN-100: fetch the comments ONCE to a file — this step counts
          # verdicts from it, and the auto-merge decision step reuses it
          # instead of re-querying. (--jq '.[]' + jq -s flattens --paginate's
          # per-page arrays into one.)
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --paginate --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/pr-verdict-comments.json"
          VERDICTS=$(jq '[.[] | select(.user.login == "github-actions[bot]")
                     | select(.body | contains("Tester verdict"))
                     | select(.created_at >= "${{ steps.guard.outputs.started }}")] | length' \
            "$RUNNER_TEMP/pr-verdict-comments.json")
          if [ "$VERDICTS" -eq 0 ]; then
            echo "::error::No tester verdict posted on PR #$PR_NUMBER since ${{ steps.guard.outputs.started }} — the tester did not complete; not labeling so the next scan retries."
            exit 1
          fi
          curl -sS --fail https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "${{ matrix.issue.id }}" --arg label "$LABEL_AGENT_TESTED" \
              '{query: "mutation($id: String!, $label: String!) { issueAddLabel(id: $id, labelId: $label) { success } }", variables: {id: $id, label: $label}}')" \
            | jq -e '.data.issueAddLabel.success' > /dev/null

      # ---- DAN-100: autonomous merge for the prompt-a-feature flow ----
      # Runs only after verdict verification + labeling succeeded. The decision
      # is pure and unit-tested (.github/scripts/auto-merge-decision.mjs):
      # merge=yes ONLY for a prompt:*-labeled ticket whose latest in-run tester
      # verdict is a PASS and whose PR draft bit was lifted — both signals,
      # never one alone. Non-prompt tickets and FAIL verdicts get merge=no and
      # nothing below runs: behavior identical to before DAN-100.
      - name: Decide auto-merge (prompt label + tester PASS)
        if: steps.guard.outputs.skip != 'true'
        id: automerge
        run: |
          set -euo pipefail
          IS_DRAFT=$(gh pr view "${{ steps.tested.outputs.pr_number }}" \
            --repo "${{ github.repository }}" --json isDraft -q .isDraft)
          node .github/scripts/auto-merge-decision.mjs \
            --comments "$RUNNER_TEMP/pr-verdict-comments.json" \
            --since "${{ steps.guard.outputs.started }}" \
            --draft "$IS_DRAFT" \
            --prompt-labeled "${{ steps.guard.outputs.prompt }}" \
            | tee -a "$GITHUB_OUTPUT"

      # Merge commit (not squash/rebase) to match the repo's merge history.
      # Any merge failure — conflict, or a later-added required-review branch
      # protection rejecting github-actions[bot] — fails the job loudly here;
      # the ticket stays In Review with `agent-tested` for the next scan or a
      # human, which is the correct degraded state.
      - name: Merge PR (prompt-labeled ticket, tester PASS)
        if: steps.guard.outputs.skip != 'true' && steps.automerge.outputs.merge == 'yes'
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.tested.outputs.pr_number }}" \
            --repo "${{ github.repository }}" --merge --delete-branch
          echo "PR #${{ steps.tested.outputs.pr_number }} merged (merge commit), branch deleted"

      # Only reached if the merge above succeeded. The relay (ai-gateway repo)
      # dispatches on the Done transition, triggering the scan that promotes
      # the next blocked ticket — this move is what closes the loop. A failure
      # here fails the job loudly: the PR is merged but the ticket sits In
      # Review, and the next human/scan pass resolves it.
      - name: Move ticket to Done
        if: steps.guard.outputs.skip != 'true' && steps.automerge.outputs.merge == 'yes'
        run: |
          set -euo pipefail
          curl -sS --fail https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "${{ matrix.issue.id }}" --arg state "$STATE_DONE" \
              '{query: "mutation($id: String!, $state: String!) { issueUpdate(id: $id, input: { stateId: $state }) { success } }", variables: {id: $id, state: $state}}')" \
            | jq -e '.data.issueUpdate.success' > /dev/null
          echo "${{ matrix.issue.identifier }} → Done (relay will dispatch the next scan)"
