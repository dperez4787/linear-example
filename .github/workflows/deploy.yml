name: Deploy

# Deploys the backend to Cloud Run on every push to main.
#
# Auth is OIDC-only via Workload Identity Federation: the job mints a GitHub
# OIDC token (which requires `id-token: write`, below) and google-github-actions/auth
# exchanges it for short-lived deploy-SA credentials. No service account key exists
# anywhere. The image is built from app/backend/Dockerfile on the runner and pushed to
# Artifact Registry — Cloud Build is deliberately not used (its API is disabled and the
# deploy SA has no Cloud Build roles). Images are tagged by commit SHA, never `latest`,
# so a rollback always resolves to the exact bytes it originally deployed.
#
# NOTE: DAN-15 adds the frontend (Firebase Hosting) job to this same file later.

on:
  push:
    branches: [main]

# DAN-70: rapid merges to main used to start overlapping deploy runs; when an
# older run finished last, production served stale bytes. One workflow-level
# group serializes ENTIRE runs — backend and frontend deploy from the same
# commit as one unit, so no job from an older run can start after a newer run
# has begun. cancel-in-progress is false (queue, strict ordering) rather than
# true (cancel the older run): a cancel can land mid `gcloud run deploy` /
# `firebase deploy` and leave the two halves on different commits, whereas
# queuing lets every started run finish atomically. GitHub keeps only the
# latest PENDING run per group, so a burst of merges collapses to "current run
# finishes, newest commit deploys next" — the newest commit always deploys
# last, and an older run can never overwrite a newer one. The group is keyed
# on github.ref so a future non-main trigger would queue separately instead of
# blocking main deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Build, push, and deploy backend
    runs-on: ubuntu-latest

    # id-token: write is mandatory — without it the OIDC token is never minted and the
    # WIF exchange in google-github-actions/auth fails at runtime.
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: project-d60a83c1-2c60-4d51-ad0
      REGION: us-central1
      SERVICE: linear-example-backend
      RUNTIME_SA: linear-example-run@project-d60a83c1-2c60-4d51-ad0.iam.gserviceaccount.com
      IMAGE: us-central1-docker.pkg.dev/project-d60a83c1-2c60-4d51-ad0/linear-example/backend:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC / Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build backend image
        run: docker build -f app/backend/Dockerfile -t "$IMAGE" app/backend

      - name: Push backend image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        # --allow-unauthenticated is explicit, not left to gcloud's default: for a
        # brand-new service in a non-interactive CI shell gcloud does not prompt and
        # creates it private. Firebase Hosting invokes the /api/** rewrite anonymously
        # (no service-agent identity to grant run.invoker to), so a private service
        # would 403 both that rewrite and /health. The service is public by design —
        # the SPA already calls the API anonymously and there is no auth layer.
        # AI_GATEWAY_KEY and LINEAR_API_KEY (DAN-60) mount exactly like
        # MONGODB_URI: Secret Manager containers whose versions a human added out
        # of band, read at runtime as the runtime SA. AI_GATEWAY_URL is plain
        # config, not a secret, so it travels as an env var.
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --min-instances=1 \
            --cpu-boost \
            --service-account="$RUNTIME_SA" \
            --set-secrets=MONGODB_URI=MONGODB_URI:latest,AI_GATEWAY_KEY=AI_GATEWAY_KEY:latest,LINEAR_API_KEY=LINEAR_API_KEY:latest \
            --set-env-vars=AI_GATEWAY_URL=https://ai-gateway-dkuqnmldta-uc.a.run.app,LINEAR_TEAM_ID=e1ef74ec-5da2-42e9-8e2b-48840faf3647,LINEAR_STATE_READY_FOR_DEV=8d578131-713b-41ea-b940-135b55b7b86b \
            --allow-unauthenticated

  frontend:
    name: Build and deploy frontend to Firebase Hosting
    runs-on: ubuntu-latest

    # Permissions are per-job, not inherited from the backend job above. id-token: write
    # is mandatory — without it the GitHub OIDC token is never minted and the WIF
    # exchange in google-github-actions/auth fails at runtime. actionlint does NOT catch
    # a missing id-token permission, so it is spelled out here deliberately.
    permissions:
      contents: read
      id-token: write

    env:
      # Pinned to an exact firebase-tools version — never a floating tag or @latest — so a
      # CLI release can't silently change deploy behavior between runs. 11.30 is the floor
      # that added ADC support for Hosting; 13.29.2 is a published release at or above it.
      FIREBASE_TOOLS_VERSION: 13.29.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the repo's Node pin (.nvmrc = 24), the same LTS the app is built on.
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build the SPA
        working-directory: app/frontend
        run: npm run build

      - name: Authenticate to Google Cloud (OIDC / Workload Identity Federation)
        # Exports a short-lived ADC credential-config file and sets
        # GOOGLE_APPLICATION_CREDENTIALS to point at it. The firebase CLI reads ADC from
        # that env var — no FIREBASE_TOKEN (a long-lived refresh credential) is used or
        # needed, and no service-account key file exists anywhere.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}

      - name: Install firebase-tools (exact pin)
        run: npm install -g firebase-tools@"$FIREBASE_TOOLS_VERSION"

      - name: Deploy to Firebase Hosting
        # Run from the repo ROOT — this is where firebase.json lives (added by DAN-14) and
        # where its `public: app/frontend/dist` path resolves. Running from app/frontend
        # would find no config and resolve `public` wrong. Auth is ADC, picked up from
        # GOOGLE_APPLICATION_CREDENTIALS exported by the auth step above.
        run: firebase deploy --only hosting --project project-d60a83c1-2c60-4d51-ad0 --non-interactive
